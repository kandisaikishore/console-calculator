name: Java compatibility checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "47 2 * * *"

permissions:
  contents: read

jobs:
  java-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - name: Locate Java files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' sources < <(find . -type f -name '*.java' -not -path './.git/*' -not -path './build-classes/*' -print0)
          test "${#sources[@]}" -gt 0
          printf 'Found %s Java source files\n' "${#sources[@]}"
      - name: Compile Java source files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' sources < <(find . -type f -name '*.java' -not -path './.git/*' -not -path './build-classes/*' -print0)
          mkdir -p build-classes
          javac -encoding UTF-8 -d build-classes "${sources[@]}"
