name: Java compatibility checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "27 2 * * *"

permissions:
  contents: read

jobs:
  java-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - name: Inspect Java source files
        run: |
          set -eu
          count=$(find . -type f -name '*.java' -not -path './.git/*' | wc -l)
          echo "Java source files found: $count"
          test "$count" -gt 0
      - name: Compile tracked Java sources
        run: |
          set -eu
          mkdir -p build-classes
          find . -type f -name '*.java' -not -path './.git/*' -not -path './build-classes/*' > /tmp/java-sources.txt
          javac -encoding UTF-8 -d build-classes @/tmp/java-sources.txt
